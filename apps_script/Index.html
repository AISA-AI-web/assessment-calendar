<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    AISA Assessment Calendar: the page shell.
    WebApp.gs renders this with two template values, both already safe to put
    inside a <script> element (see safeJson_ in WebApp.gs):
      bootstrapJson  the signed-in person, settings, classes and school days
      paramsJson     view/date/scope from the URL, for deep links
    All CSS is in Styles.html and all JavaScript in App.html.
  -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <base target="_top">
  <title>Assessment Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
  <?!= include('Styles') ?>
</head>
<body>
  <noscript>
    <p class="noscript">The Assessment Calendar needs JavaScript. Turn it on for script.google.com and reload.</p>
  </noscript>

  <div id="app" class="app" aria-busy="true">
    <div id="live" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
    <a class="skip-link" href="#main">Skip to the calendar</a>

    <header id="header" class="header">
      <div class="header__brand">
        <p class="eyebrow eyebrow--gold">AISA · Teaching &amp; Learning</p>
        <h1 class="header__title">Assessment Calendar</h1>
      </div>
      <div class="header__right" id="header-right"></div>
    </header>

    <div id="banners" class="banners"></div>
    <nav id="scopebar" class="scopebar" aria-label="Whose calendar"></nav>
    <div id="toolbar" class="toolbar"></div>
    <div id="legend" class="legend"></div>

    <main id="main" class="main" tabindex="-1">
      <h2 id="view-title" class="view-title"></h2>
      <div id="view" class="view"></div>
    </main>

    <footer id="footer" class="footer"></footer>
  </div>

  <div id="backdrop" class="backdrop" hidden></div>
  <div id="drawer-host"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="application/json" id="boot-data"><?!= typeof bootstrapJson === 'undefined' ? 'null' : bootstrapJson ?></script>
  <script type="application/json" id="boot-params"><?!= typeof paramsJson === 'undefined' ? '{}' : paramsJson ?></script>
  <?!= include('App') ?>
</body>
</html>
