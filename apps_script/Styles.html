<style>
/* ==========================================================================
   AISA Assessment Calendar: every style.
   Brand: DM Sans; purple #21076C for structure, gold #D8B664 for accents and
   calls to action only (it is 2.1:1 on white, so never small text on white);
   white backgrounds with #F2EFFA as the only tint. Colour is never the only
   signal: load, status and category always carry a word or a number too.
   Mobile first: the base rules are the phone layout.
   ========================================================================== */

:root {
  --aisa-purple: #21076C;
  --aisa-gold: #D8B664;
  --aisa-white: #FFFFFF;
  --aisa-near-black: #1A1A1A;
  --aisa-muted-gray: #555555;
  --aisa-purple-tint: #F2EFFA;
  --aisa-purple-border: #C8BEE8;
  --aisa-font: 'DM Sans', sans-serif;
  --aisa-radius: 8px;

  /* Derived, all within the brand family */
  --purple-hover: #33128F;
  --purple-mid: #6B4FB8;
  --purple-soft: #BFB0E6;
  --exam: #2F3B52;
  --alert: #8C1D18;
  --alert-tint: #FBECEB;
  --ok: #1F6B4A;
  --ok-tint: #E8F3EE;
  --warn-border: #A9761B;
  --warn-tint: #FFF4DA;
  --closed-fill: #F5F5F7;
  --scrim: rgb(33 7 108 / 45%);
  --shadow-1: 0 1px 2px rgb(33 7 108 / 8%), 0 2px 8px rgb(33 7 108 / 6%);
  --shadow-2: 0 4px 12px rgb(33 7 108 / 14%), 0 16px 40px rgb(33 7 108 / 18%);
  --focus: 0 0 0 2px var(--aisa-white), 0 0 0 4px var(--aisa-purple);
  --gutter: 16px;
  --tap: 44px;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--aisa-white);
  color: var(--aisa-near-black);
  font-family: var(--aisa-font);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: none; box-shadow: var(--focus); }
a { color: var(--aisa-purple); }

.visually-hidden {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip-link { position: absolute; left: 8px; top: -60px; background: var(--aisa-white); padding: 8px 12px; border-radius: var(--aisa-radius); z-index: 100; }
.skip-link:focus { top: 8px; }
.noscript { padding: 24px; }

.eyebrow { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--aisa-muted-gray); }
.eyebrow--gold { color: var(--aisa-gold); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--tap); padding: 0 14px; border-radius: var(--aisa-radius);
  border: 1px solid var(--aisa-purple-border); background: var(--aisa-white);
  color: var(--aisa-purple); font-weight: 500; white-space: nowrap; text-decoration: none;
}
.btn:hover { border-color: var(--aisa-purple); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn--primary { background: var(--aisa-purple); border-color: var(--aisa-purple); color: var(--aisa-white); font-weight: 700; }
.btn--primary:hover { background: var(--purple-hover); }
.btn--gold { background: var(--aisa-gold); border-color: var(--aisa-gold); color: var(--aisa-purple); font-weight: 700; }
.btn--gold:hover { filter: brightness(1.05); border-color: var(--aisa-purple); }
.btn--danger { color: var(--alert); border-color: #E3B5B2; }
.btn--danger:hover { border-color: var(--alert); }
.btn--ghost { border-color: transparent; background: transparent; }
.btn--small { min-height: 34px; padding: 0 10px; font-size: 14px; }
.btn--icon { width: var(--tap); padding: 0; font-size: 20px; }
.btn .count { display: inline-block; min-width: 22px; padding: 1px 6px; border-radius: 11px; background: var(--aisa-gold); color: var(--aisa-purple); font-size: 13px; font-weight: 700; }

/* ---------- header ---------- */
.header {
  background: var(--aisa-purple); color: var(--aisa-white);
  padding: 14px var(--gutter); display: flex; flex-wrap: wrap; gap: 10px 16px;
  align-items: center; justify-content: space-between;
}
.header__title { margin: 2px 0 0; font-size: 22px; line-height: 1.2; font-weight: 700; color: var(--aisa-white); }
.header__title small { font-size: 14px; font-weight: 400; opacity: .85; margin-left: 6px; }
.header__right { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.header .btn { background: transparent; color: var(--aisa-white); border-color: rgb(255 255 255 / 35%); }
.header .btn:hover { border-color: var(--aisa-white); }
.header :focus-visible { box-shadow: 0 0 0 2px var(--aisa-purple), 0 0 0 4px var(--aisa-gold); }
.who { display: flex; flex-direction: column; font-size: 13px; line-height: 1.25; text-align: left; }
.who__email { display: none; }
.who b { font-weight: 700; }
.role { display: inline-block; margin-top: 2px; padding: 1px 8px; border-radius: 10px; background: var(--aisa-gold); color: var(--aisa-purple); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; align-self: flex-start; }

/* ---------- banners ---------- */
.banners { padding: 0 var(--gutter); }
.banner { margin-top: 12px; padding: 10px 14px; border-radius: var(--aisa-radius); border: 1px solid var(--aisa-purple-border); background: var(--aisa-purple-tint); font-size: 14px; }
.banner--warn { background: var(--warn-tint); border-color: var(--warn-border); }
.banner--alert { background: var(--alert-tint); border-color: var(--alert); color: var(--alert); }
.banner ul { margin: 4px 0 0; padding-left: 20px; }

/* ---------- scope bar ---------- */
.scopebar { padding: 12px var(--gutter) 0; display: flex; flex-direction: column; gap: 10px; }
.scope-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.scope-label { font-size: 13px; color: var(--aisa-muted-gray); margin-right: 4px; }
.pill {
  min-height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid var(--aisa-purple-border);
  background: var(--aisa-white); color: var(--aisa-purple); font-weight: 500;
}
.pill[aria-pressed="true"] { background: var(--aisa-purple); border-color: var(--aisa-purple); color: var(--aisa-white); font-weight: 700; }
.pill--mine { border-style: dashed; }
.select, .input, .textarea {
  min-height: 40px; padding: 8px 10px; border: 1px solid var(--aisa-purple-border); border-radius: var(--aisa-radius);
  background: var(--aisa-white); color: var(--aisa-near-black); max-width: 100%;
}
.select:focus, .input:focus, .textarea:focus { outline: none; border-color: var(--aisa-purple); box-shadow: 0 0 0 1px var(--aisa-purple); }
.textarea { width: 100%; min-height: 76px; resize: vertical; }
.scope-me { font-weight: 700; color: var(--aisa-purple); }

/* ---------- toolbar ---------- */
.toolbar { padding: 12px var(--gutter) 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar__period { font-size: 20px; font-weight: 700; color: var(--aisa-purple); margin: 0 6px; min-width: 9ch; }
.toolbar__spacer { flex: 1 1 auto; }
.seg { display: inline-flex; border: 1px solid var(--aisa-purple-border); border-radius: var(--aisa-radius); overflow: hidden; }
.seg button { min-height: 40px; padding: 0 14px; border: 0; background: var(--aisa-white); color: var(--aisa-purple); font-weight: 500; }
.seg button + button { border-left: 1px solid var(--aisa-purple-border); }
.seg button[aria-pressed="true"] { background: var(--aisa-purple); color: var(--aisa-white); font-weight: 700; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.filters .input { width: 160px; }
.progress { height: 3px; margin: 10px var(--gutter) 0; background: transparent; overflow: hidden; border-radius: 2px; }
.progress span { display: block; height: 100%; width: 30%; background: var(--aisa-gold); animation: slide 1.1s infinite ease-in-out; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }

/* ---------- legend ---------- */
.legend { padding: 8px var(--gutter) 0; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13px; color: var(--aisa-muted-gray); }
.legend .chip { cursor: default; }

/* ---------- main ---------- */
.main { padding: 8px var(--gutter) 24px; outline: none; }
.view-title { margin: 6px 0 10px; font-size: 16px; font-weight: 500; color: var(--aisa-muted-gray); }
.view-title b { color: var(--aisa-purple); }
.view { transition: opacity .15s; }
.view.is-loading { opacity: .55; }
.footer { padding: 12px var(--gutter) 28px; font-size: 13px; color: var(--aisa-muted-gray); border-top: 1px solid var(--aisa-purple-tint); }

/* ---------- rotation badge, load meter ---------- */
.rot { display: inline-block; padding: 0 6px; border-radius: 6px; background: var(--aisa-purple-tint); color: var(--aisa-purple); font-size: 12px; font-weight: 700; line-height: 20px; }
.meter { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: var(--aisa-muted-gray); }
.meter__bar { display: inline-flex; gap: 2px; }
.meter__seg { width: 10px; height: 10px; border-radius: 2px; border: 1px solid var(--aisa-purple-border); background: var(--aisa-white); }
.meter__seg.on { background: var(--purple-soft); border-color: var(--purple-mid); }
.meter[data-level="full"] { color: var(--aisa-purple); }
.meter[data-level="full"] .meter__seg.on { background: var(--aisa-purple); border-color: var(--aisa-purple); }
.meter[data-level="over"] { color: var(--alert); }
.meter[data-level="over"] .meter__seg.on { background: var(--alert); border-color: var(--alert); }

/* ---------- entry chips ---------- */
.chip {
  display: flex; align-items: center; gap: 6px; width: 100%; min-height: 28px; padding: 3px 6px;
  border-radius: 6px; border: 1px solid transparent; text-align: left; font-size: 13px; line-height: 1.25;
  background: var(--aisa-purple); color: var(--aisa-white);
}
.chip__code { flex: none; font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 1px 4px; border-radius: 3px; background: rgb(255 255 255 / 20%); }
.chip__text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.chip__flag { flex: none; margin-left: auto; font-size: 11px; font-weight: 700; }
.chip[data-cat="EXAM"] { background: var(--exam); }
.chip[data-clash] { background: var(--alert); border-color: var(--alert); color: var(--aisa-white); }
.legend__clash { display: inline-block; width: 14px; height: 14px; margin-right: 4px; border-radius: 3px; background: var(--alert); vertical-align: -2px; }
.chip[data-cat="FORMATIVE"] { background: var(--aisa-purple-tint); color: var(--aisa-purple); border-color: var(--aisa-purple-border); }
.chip[data-cat="FORMATIVE"] .chip__code { background: var(--aisa-white); }
.chip[data-status="PENDING"] { background: var(--aisa-white); color: var(--aisa-purple); border: 1px dashed var(--aisa-purple); }
.chip[data-status="PENDING"] .chip__code { background: var(--aisa-purple-tint); }
.chip[data-status="DECLINED"] { background: var(--aisa-white); color: var(--aisa-muted-gray); border: 1px dashed var(--aisa-muted-gray); text-decoration: line-through; }
.chip:hover { filter: brightness(1.12); }
.chip[data-cat="FORMATIVE"]:hover, .chip[data-status]:hover { filter: none; border-color: var(--aisa-purple); }
.more { border: 0; background: none; color: var(--aisa-purple); font-size: 12px; font-weight: 700; padding: 2px 4px; text-align: left; }

/* context lines from the Internal Calendar */
.ctx { display: flex; gap: 5px; align-items: baseline; font-size: 12px; line-height: 1.3; color: var(--aisa-muted-gray); }
.ctx__icon { flex: none; width: 14px; text-align: center; font-weight: 700; }
.ctx__text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ctx[data-cat="NO_ASSESSMENTS"], .ctx[data-cat="EXAM_WINDOW"] { color: var(--alert); font-weight: 500; }
.ctx[data-cat="TESTING"], .ctx[data-cat="CAUTION"] { color: #6B4A10; }
.ctx[data-cat="DEADLINE"] { font-style: italic; }

/* ---------- month grid ---------- */
.month { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid var(--aisa-purple-border); border-radius: var(--aisa-radius); overflow: hidden; }
.month__dow { padding: 8px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--aisa-purple); background: var(--aisa-purple-tint); border-bottom: 1px solid var(--aisa-purple-border); }
.cell { position: relative; min-height: 132px; padding: 6px; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid var(--aisa-purple-tint); border-bottom: 1px solid var(--aisa-purple-tint); background: var(--aisa-white); cursor: pointer; min-width: 0; }
.cell:nth-child(5n) { border-right: 0; }
.cell:hover { background: #FBFAFE; }
.cell--other { background: #FCFCFD; }
.cell--other .cell__num { color: #9A9A9A; }
.cell--closed, .cell--closed:hover { background: repeating-linear-gradient(135deg, var(--closed-fill), var(--closed-fill) 6px, var(--aisa-white) 6px, var(--aisa-white) 12px); cursor: default; }
.cell--today { box-shadow: inset 0 0 0 2px var(--aisa-gold); }
.cell__top { display: flex; align-items: center; gap: 6px; }
.cell__num { border: 0; background: none; padding: 0 2px; font-size: 15px; font-weight: 700; color: var(--aisa-near-black); border-radius: 4px; }
.cell__top .meter { margin-left: auto; }
.cell__status { font-size: 12px; color: var(--aisa-muted-gray); font-weight: 500; }
.cell__chips { display: flex; flex-direction: column; gap: 3px; min-width: 0; }

/* ---------- week grid ---------- */
.week { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; border: 1px solid var(--aisa-purple-border); border-radius: var(--aisa-radius); overflow: hidden; }
.week th, .week td { border-right: 1px solid var(--aisa-purple-tint); border-bottom: 1px solid var(--aisa-purple-tint); vertical-align: top; padding: 5px; }
.week th:last-child, .week td:last-child { border-right: 0; }
.week thead th { background: var(--aisa-purple-tint); text-align: left; font-weight: 700; color: var(--aisa-purple); }
.week__corner { width: 88px; }
.week__day { display: flex; flex-direction: column; gap: 4px; }
.week__dayname { font-size: 14px; }
.week__row th { background: #FCFCFE; text-align: left; font-size: 13px; color: var(--aisa-purple); font-weight: 700; }
.week__row th small { display: block; font-weight: 400; color: var(--aisa-muted-gray); font-size: 12px; }
.week td { height: 52px; background: var(--aisa-white); }
.week td.slot { cursor: pointer; }
.week td.slot:hover { background: #FBFAFE; }
.week td.none { background: repeating-linear-gradient(135deg, var(--closed-fill), var(--closed-fill) 6px, var(--aisa-white) 6px, var(--aisa-white) 12px); }
.week td.closed { background: var(--closed-fill); color: var(--aisa-muted-gray); font-size: 12px; }
.week .time { display: block; font-size: 11px; color: var(--aisa-muted-gray); margin-bottom: 2px; }
.week .cell__chips { gap: 3px; }

/* ---------- agenda (phone) ---------- */
.agenda { display: flex; flex-direction: column; gap: 10px; }
.aday { border: 1px solid var(--aisa-purple-border); border-radius: var(--aisa-radius); padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.aday--today { border-color: var(--aisa-gold); box-shadow: inset 4px 0 0 var(--aisa-gold); }
.aday--closed { background: var(--closed-fill); border-style: dashed; padding: 8px 10px; }
.aday__head { display: flex; align-items: center; gap: 8px; }
.aday__date { font-weight: 700; color: var(--aisa-purple); border: 0; background: none; padding: 0; font-size: 15px; }
.aday__head .meter { margin-left: auto; }
.aday .chip { min-height: 36px; font-size: 14px; }
.empty { padding: 28px 16px; text-align: center; color: var(--aisa-muted-gray); border: 1px dashed var(--aisa-purple-border); border-radius: var(--aisa-radius); }
.empty b { display: block; color: var(--aisa-purple); font-size: 17px; margin-bottom: 4px; }

/* ---------- drawers ---------- */
.backdrop { position: fixed; inset: 0; background: var(--scrim); z-index: 50; }
.drawer {
  position: fixed; inset: 0; z-index: 60; background: var(--aisa-white); display: flex; flex-direction: column;
  box-shadow: var(--shadow-2);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.drawer__head { display: flex; align-items: flex-start; gap: 12px; padding: 14px var(--gutter); border-bottom: 1px solid var(--aisa-purple-tint); }
.drawer__title { margin: 2px 0 0; font-size: 20px; color: var(--aisa-purple); line-height: 1.25; }
.drawer__close { margin-left: auto; flex: none; }
.drawer__body { flex: 1 1 auto; overflow-y: auto; padding: 14px var(--gutter) 24px; display: flex; flex-direction: column; gap: 14px; }
.drawer__foot { border-top: 1px solid var(--aisa-purple-tint); padding: 12px var(--gutter); display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; }
.drawer__foot .note { margin-right: auto; font-size: 13px; color: var(--aisa-muted-gray); }

.section-title { margin: 0 0 6px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--aisa-muted-gray); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; font-size: 15px; }
.kv dt { color: var(--aisa-muted-gray); }
.kv dd { margin: 0; }
.card { border: 1px solid var(--aisa-purple-border); border-radius: var(--aisa-radius); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.card--tint { background: var(--aisa-purple-tint); }
.card h3 { margin: 0; font-size: 16px; color: var(--aisa-purple); }
.muted { color: var(--aisa-muted-gray); font-size: 14px; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 700; background: var(--aisa-purple-tint); color: var(--aisa-purple); }
.tag--alert { background: var(--alert-tint); color: var(--alert); }
.tag--ok { background: var(--ok-tint); color: var(--ok); }
.tag--warn { background: var(--warn-tint); color: #6B4A10; }
.list { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }

/* ---------- booking form ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > .label { font-weight: 700; font-size: 14px; color: var(--aisa-near-black); }
.field .hint { font-size: 13px; color: var(--aisa-muted-gray); font-weight: 400; }
.field .input, .field .select { width: 100%; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--aisa-purple); flex: none; }
.classes { display: flex; flex-direction: column; gap: 4px; max-height: 280px; overflow-y: auto; border: 1px solid var(--aisa-purple-border); border-radius: var(--aisa-radius); padding: 8px; }
.classes__grade { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--aisa-muted-gray); margin: 6px 0 2px; }
.classes .check { padding: 4px 2px; }
.classes .check small { display: block; color: var(--aisa-muted-gray); font-size: 12px; }
.rows { display: flex; flex-direction: column; gap: 10px; }
.rowcard { border: 1px solid var(--aisa-purple-border); border-radius: var(--aisa-radius); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.rowcard__head { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
.rowcard__name { font-weight: 700; color: var(--aisa-purple); }
.rowcard__line { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.periods { display: flex; flex-wrap: wrap; gap: 4px; }
.pchip { min-width: 40px; min-height: 36px; border-radius: 6px; border: 1px solid var(--aisa-purple-border); background: var(--aisa-white); color: var(--aisa-purple); font-weight: 700; font-size: 13px; }
.pchip[aria-pressed="true"] { background: var(--aisa-purple); border-color: var(--aisa-purple); color: var(--aisa-white); }
.pchip.meets { border-color: var(--purple-mid); border-width: 2px; }
.quick { display: flex; flex-wrap: wrap; gap: 4px; font-size: 13px; }
.quick button { border: 1px solid var(--aisa-purple-border); background: var(--aisa-purple-tint); color: var(--aisa-purple); border-radius: 14px; padding: 3px 10px; font-size: 13px; }

.verdict { border-radius: var(--aisa-radius); padding: 10px 12px; border: 1px solid var(--aisa-purple-border); display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.verdict__head { display: flex; gap: 8px; align-items: center; font-weight: 700; }
.verdict__icon { flex: none; width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; color: var(--aisa-white); background: var(--ok); }
.verdict[data-v="OK"] { background: var(--ok-tint); border-color: #9CC9B4; }
.verdict[data-v="WARN"] { background: var(--warn-tint); border-color: var(--warn-border); }
.verdict[data-v="WARN"] .verdict__icon { background: var(--warn-border); }
.verdict[data-v="BLOCK"], .verdict[data-v="INVALID"] { background: var(--alert-tint); border-color: var(--alert); }
.verdict[data-v="BLOCK"] .verdict__icon, .verdict[data-v="INVALID"] .verdict__icon { background: var(--alert); }
.issues { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.issues small { display: block; color: var(--aisa-muted-gray); }
.clashes { margin: 0; padding-left: 18px; }
details summary { cursor: pointer; color: var(--aisa-purple); font-weight: 500; }
.emails { font-size: 13px; columns: 2; margin: 6px 0 0; padding-left: 18px; }
